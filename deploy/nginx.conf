upstream global_ranks {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name ranks.example.com;

    # Redirect HTTP to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ranks.example.com;

    # ----- TLS ------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/ranks.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ranks.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ----- Security headers ------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer" always;

    # ----- Request limits --------------------------------------------------
    client_max_body_size 16k;

    # ----- API proxy -------------------------------------------------------
    location /api/ {
        proxy_pass         http://global_ranks;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
        proxy_send_timeout    5s;
    }

    # ----- Avatar caching --------------------------------------------------
    location /api/v1/avatars/ {
        proxy_pass         http://global_ranks;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Avatars are immutable (keyed by UUID). Cache at the proxy level.
        proxy_cache_valid 200 24h;
    }

    # Block everything else.
    location / {
        return 404;
    }
}
